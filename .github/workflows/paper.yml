name: paper-trade

# Runs every hour. Since 2026-11-06 the paper bot trades one strategy: the v2 base rule
# (kalshi_weather/v2.py). Older strategies are stopped; their trades stay in the ledger and
# still settle here. The ledger (ledger/paper.db) is committed back to the repo.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write
  id-token: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle finished trades, then paper-trade the v2 base rule
        run: |
          python -m kalshi_weather --data ledger settle
          python -m kalshi_weather --data ledger paper --strategy v2 || echo "v2 paper step failed"
          python -m kalshi_weather --data ledger report
          python -m kalshi_weather --data ledger brain --alerts alerts.txt
      - name: Open an issue if the brain stopped a strategy
        if: hashFiles('alerts.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s alerts.txt ]; then
            gh issue create --title "Brain stopped a strategy" --body-file alerts.txt
          fi
      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/paper.db
          git diff --cached --quiet || (git commit -m "Update paper ledger" && git pull --rebase && git push)
      - name: Build dashboard
        run: |
          if git fetch -q --depth 1 origin data; then git worktree add -q --detach store FETCH_HEAD; fi
          python -m kalshi_weather --data ledger dashboard --out site/index.html --store store \
            --repo-url "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true      # a dashboard hiccup must not fail the trading run
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true      # GitHub Pages outages happen; the next run republishes
